<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模拟器设置</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f5;color:#183338;font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif}header,main{max-width:900px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid #dce6e3}nav{display:flex;gap:15px}a{color:#087c71}h1{margin:0;font-size:27px}h2{margin:0 0 10px;font-size:18px}p,small{color:#64787b}.card{background:white;border:1px solid #dce6e3;border-radius:14px;padding:20px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}label{display:block;font-size:13px;font-weight:600}input{display:block;width:100%;border:1px solid #cbdad5;border-radius:8px;padding:9px;font:inherit;margin-top:5px}input[type=checkbox]{display:inline;width:auto;margin-right:7px}button{background:#087c71;color:white;border:0;border-radius:8px;padding:10px 17px;font:inherit;cursor:pointer}#status{margin-left:10px;color:#64787b}@media(max-width:600px){header{display:block}.grid{grid-template-columns:1fr}nav{margin-top:10px}}</style></head><body><header><div><h1>设置</h1><p>固定参数与平台费率集中在这里。</p></div><nav><a href="/">历史回测</a><a href="/trade">模拟交易</a><a href="/settings">设置</a></nav></header><main><section class="card"><h2>历史回测假设</h2><p>仅影响之后发起的回测，保存在此浏览器。费用是模拟值，请按本人平台实际费率修改。</p><div class="grid"><label>场内佣金率<input id="commission_rate" type="number" min="0" max="0.02" step="0.0001"></label><label>场内最低佣金（元）<input id="min_commission" type="number" min="0" step="0.01"></label><label>017641 / 050025 申购费率<input id="fund_fee_rate" type="number" min="0" max="0.1" step="0.0001"></label><label>012692 申购费率<input id="bond_fee_rate" type="number" min="0" max="0.1" step="0.0001"></label><label>场内买入滑点率<input id="slippage_rate" type="number" min="0" max="0.05" step="0.0001"></label></div><p><label><input id="reinvest_dividends" type="checkbox">现金分红到帐后尝试再投资</label></p><button id="saveBacktest">保存回测假设</button><span id="status"></span></section><section class="card"><h2>模拟交易账户参数</h2><p>模拟交易账户有独立的订单、现金及平台核验设置。进入 <a href="/trade">模拟交易页</a> 可查看账户与订单。</p><div class="grid"><label>佣金率<input id="trade_commission_rate" type="number" min="0" step="0.0001"></label><label>最低佣金（元）<input id="trade_minimum_commission" type="number" min="0" step="0.01"></label><label>017641 单日申购额度（元）<input id="trade_quota_017641" type="number" min="0"></label><label>017641 申购费率<input id="trade_fee_017641" type="number" min="0" step="0.0001"></label><label>012692 申购费率<input id="trade_fee_012692" type="number" min="0" step="0.0001"></label><label>股票卖出印花税率<input id="trade_stamp_duty_rate" type="number" min="0" step="0.0001" placeholder="未核验留空"></label></div><p><label><input id="trade_platform_017641_verified" type="checkbox">017641 平台规则已核验</label><label><input id="trade_platform_012692_verified" type="checkbox">012692 平台规则已核验</label><label><input id="trade_stamp_duty_verified" type="checkbox">卖出税费已核验</label></p><button id="saveTrade">保存交易参数</button><span id="tradeStatus"></span></section></main><script>
const $=id=>document.getElementById(id),keys=['commission_rate','min_commission','fund_fee_rate','bond_fee_rate','slippage_rate'];let b={commission_rate:0.0003,min_commission:5,fund_fee_rate:0.0012,bond_fee_rate:0.0005,slippage_rate:0,reinvest_dividends:true};try{Object.assign(b,JSON.parse(localStorage.getItem('backtest_settings')||'{}'))}catch{};keys.forEach(k=>$(k).value=b[k]);$('reinvest_dividends').checked=b.reinvest_dividends!==false;$('saveBacktest').onclick=()=>{const x=Object.fromEntries(keys.map(k=>[k,Number($(k).value)]));if(keys.some(k=>!Number.isFinite(x[k])||x[k]<0)){ $('status').textContent='请输入有效非负数';return}x.reinvest_dividends=$('reinvest_dividends').checked;localStorage.setItem('backtest_settings',JSON.stringify(x));$('status').textContent='已保存'};
const tkeys=['commission_rate','minimum_commission','quota_017641','fee_017641','fee_012692','stamp_duty_rate'],checks=['platform_017641_verified','platform_012692_verified','stamp_duty_verified'];fetch('/api/state').then(r=>r.json()).then(r=>{const s=r.settings;tkeys.forEach(k=>$('trade_'+k).value=s[k]??'');checks.forEach(k=>$('trade_'+k).checked=!!s[k])});$('saveTrade').onclick=async()=>{const x=Object.fromEntries(tkeys.map(k=>[k,$('trade_'+k).value===''?null:Number($('trade_'+k).value)]));checks.forEach(k=>x[k]=$('trade_'+k).checked);try{const r=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)});const v=await r.json();if(!r.ok)throw Error(v.detail||'保存失败');$('tradeStatus').textContent='已保存'}catch(e){$('tradeStatus').textContent=e.message}};
</script></body></html>
